# Copy this file to recall.local.properties (same folder) and fill in only the parts you use.
# recall.local.properties is ignored by Git, so your keys and passwords stay on this computer.
# On a hosting platform, set the matching environment variables instead (see README).

# --- Database (optional). Without it, accounts are stored in local files. ---
# Supabase: Project > Connect > "Session pooler". The postgresql:// address shown there works as-is.
#recall.database.url=postgresql://YOUR-HOST:5432/postgres
#recall.database.username=YOUR-DATABASE-USER
#recall.database.password=YOUR-DATABASE-PASSWORD

# --- AI answers (optional). Pick a provider, copy a model name from its model list, paste your key. ---
# provider is one of: groq, gemini, openrouter, openai, ollama (ollama runs on this computer and needs no key)
#recall.ai.provider=groq
#recall.ai.model=MODEL-NAME-FROM-THE-PROVIDER
#recall.ai.key=YOUR-KEY

# --- Google sign-in (optional). The OAuth client ID from Google Cloud Console. ---
#recall.google-client-id=YOUR-CLIENT-ID.apps.googleusercontent.com
