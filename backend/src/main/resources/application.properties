spring.application.name=backend
# Hosting platforms choose the port through PORT; locally it is 8080.
server.port=${PORT:8080}

# Private settings (database, AI key, Google client ID) go in backend/recall.local.properties, which Git ignores,
# or in environment variables. Never put real values in this file.
spring.config.import=optional:file:./recall.local.properties

# Optional Google sign-in. A public OAuth client ID, supplied through the environment; never commit a value here.
recall.google-client-id=${RECALL_GOOGLE_CLIENT_ID:}

# Optional PostgreSQL account storage (Supabase, Neon or a local install). Leave unset to store accounts in local files.
recall.database.url=${RECALL_DATABASE_URL:}
recall.database.username=${RECALL_DATABASE_USER:postgres}
recall.database.password=${RECALL_DATABASE_PASSWORD:}

# Optional AI answers through an OpenAI-compatible provider. provider: groq, gemini, openrouter, openai or ollama.
recall.ai.provider=${RECALL_AI_PROVIDER:}
recall.ai.base-url=${RECALL_AI_BASE_URL:}
recall.ai.model=${RECALL_AI_MODEL:}
recall.ai.key=${RECALL_AI_KEY:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
spring.mvc.log-request-details=false

logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc.core=INFO
